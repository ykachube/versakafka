# rustfmt configuration for Resilient Kafka Proxy

# Edition
edition = "2021"

# Line width
max_width = 100

# Indentation
indent_style = "Block"
tab_spaces = 4
hard_tabs = false

# Newlines
newline_style = "Unix"

# Imports
imports_granularity = "Crate"
group_imports = "StdExternalCrate"
imports_layout = "Vertical"

# Formatting
normalize_doc_attributes = true
normalize_doc_comments = true
wrap_comments = true

# Functions
fn_args_layout = "Tall"
fn_return_indent = "Block"

# Control flow
brace_style = "SameLineWhere"
control_brace_style = "SameLineWhere"
empty_item_single_line = true

# Matches
match_block_trailing_comma = true
match_arm_leading_pipe = "Never"

# Structs/Enums
struct_lit_single_line = false
enum_discrim_align = true

# Attributes
format_code_in_doc_comments = true