services:
  # ============================================================
  # KAFKA CLUSTER (Single broker for testing)
  # ============================================================
  kafka-1:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka-1
    container_name: kp-test-kafka-1
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-1:29092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 168
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg
    volumes:
      - kafka-1-data:/var/lib/kafka/data
    networks:
      - kp-test-network

  # ============================================================
  # LOCALSTACK - AWS Mocks (KMS, S3, DynamoDB, etc.)
  # ============================================================
  localstack:
    image: localstack/localstack:3.0
    hostname: localstack
    container_name: kp-test-localstack
    ports:
      - "4566:4566"
      - "4510-4559:4510-4559"
    environment:
      SERVICES: kms,s3,dynamodb,lambda,secretsmanager,sts,iam
      DEBUG: "1"
      DEFAULT_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      KMS_PORT: 4566
    volumes:
      - localstack-data:/var/lib/localstack
      - ./localstack-init:/etc/localstack/init/ready.d
    networks:
      - kp-test-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ============================================================
  # MINIO - S3-compatible with fault injection
  # ============================================================
  minio:
    image: minio/minio:latest
    hostname: minio
    container_name: kp-test-minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      MINIO_PROMETHEUS_AUTH_TYPE: public
    volumes:
      - minio-data:/data
    networks:
      - kp-test-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio-setup:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set minio http://minio:9000 minioadmin minioadmin; do echo 'waiting for minio...'; sleep 2; done;
      mc mb --ignore-existing minio/kafka-spill;
      mc mb --ignore-existing minio/kafka-wal;
      mc anonymous set public minio/kafka-spill;
      mc anonymous set public minio/kafka-wal;
      echo 'MinIO setup complete';
      "
    networks:
      - kp-test-network

  # ============================================================
  # TOXIPROXY - Chaos testing
  # ============================================================
  toxiproxy:
    image: shopify/toxiproxy:latest
    hostname: toxiproxy
    container_name: kp-test-toxiproxy
    ports:
      - "8474:8474"
      - "8666:8666"
      - "8668:8668"
      - "8669:8669"
    environment:
      - TOXIPROXY_HOST=0.0.0.0
    volumes:
      - ./toxiproxy-scenarios:/scenarios
    networks:
      - kp-test-network
    command: >
      /bin/sh -c "
      toxiproxy-server &
      sleep 2;
      toxiproxy-cli create kafka-primary -l 0.0.0.0:8666 -u kafka-1:9092;
      toxiproxy-cli create localstack -l 0.0.0.0:8668 -u localstack:4566;
      toxiproxy-cli create minio -l 0.0.0.0:8669 -u minio:9000;
      wait
      "

  # ============================================================
  # FAKE ARC - Regional endpoint mock
  # ============================================================
  fake-arc:
    image: nginx:alpine
    hostname: fake-arc
    container_name: kp-test-fake-arc
    ports:
      - "8080-8084:8080-8084"
    volumes:
      - ./fake-arc/arc.conf:/etc/nginx/conf.d/arc.conf:ro
      - ./fake-arc/scenarios:/scenarios
    networks:
      - kp-test-network
    command: >
      /bin/sh -c "
      (while true; do
        if [ -f /scenarios/current.json ]; then
          cp /scenarios/current.json /etc/nginx/conf.d/scenario.conf;
          nginx -s reload;
        fi;
        sleep 1;
      done) &
      nginx -g 'daemon off;'
      "

  # ============================================================
  # PROXY UNDER TEST (placeholder)
  # ============================================================
  proxy:
    image: alpine:latest
    hostname: proxy
    container_name: kp-test-proxy
    ports:
      - "9093:9092"
      - "9095:9095"
    environment:
      KP_CONFIG: /config/test-config.toml
      RUST_LOG: debug
    volumes:
      - ./proxy-config:/config:ro
    networks:
      - kp-test-network
    depends_on:
      - kafka-1
      - localstack
      - minio
    command: sleep infinity

  # ============================================================
  # OBSERVABILITY STACK
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.48.0
    hostname: prometheus
    container_name: kp-test-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.test.yml:/etc/prometheus/prometheus.yml
      - prometheus-test-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - kp-test-network

  grafana:
    image: grafana/grafana:10.2.2
    hostname: grafana
    container_name: kp-test-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_INSTALL_PLUGINS: grafana-piechart-panel
    volumes:
      - grafana-test-data:/var/lib/grafana
      - ./grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    networks:
      - kp-test-network
    depends_on:
      - prometheus

  jaeger:
    image: jaegertracing/all-in-one:1.53
    hostname: jaeger
    container_name: kp-test-jaeger
    ports:
      - "16686:16686"
      - "6831:6831/udp"
      - "14268:14268"
      - "14250:14250"
    environment:
      COLLECTOR_OTLP_ENABLED: true
      SPAN_STORAGE_TYPE: badger
    volumes:
      - jaeger-test-data:/var/lib/jaeger
    networks:
      - kp-test-network

  # ============================================================
  # TEST RUNNER
  # ============================================================
  test-runner:
    image: alpine:latest
    hostname: test-runner
    container_name: kp-test-runner
    environment:
      KP_KAFKA_BOOTSTRAP: kafka-1:9092
      KP_PROXY_ADDR: proxy:9092
      KP_TOXIPROXY_ADDR: toxiproxy:8474
      KP_LOCALSTACK_ADDR: localstack:4566
      KP_MINIO_ADDR: minio:9000
      KP_FAKE_ARC_ADDR: fake-arc:8080
      KP_JAEGER_ADDR: jaeger:6831
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
      RUST_LOG: info
    volumes:
      - ./test-scenarios:/scenarios:ro
      - ./test-results:/results
    networks:
      - kp-test-network
    depends_on:
      - proxy
      - toxiproxy
      - fake-arc
    command: sleep infinity

networks:
  kp-test-network:
    driver: bridge

volumes:
  kafka-1-data:
  minio-data:
  localstack-data:
  prometheus-test-data:
  grafana-test-data:
  jaeger-test-data: