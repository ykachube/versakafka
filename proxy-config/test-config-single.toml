[proxy]
listen_addr = "0.0.0.0:9092"
max_connections = 10000

[proxy.backpressure]
enable = true
max_pending_requests = 10000

[proxy.tls]
enabled = false

[proxy.telemetry]
prometheus_addr = "0.0.0.0:9095"
jaeger_agent = "jaeger:6831"
log_level = "debug"
log_format = "json"

[filters]
enabled = true
chain = [
  { name = "enrichment", enabled = true, config = { headers = { "x-proxy-version" = "test", "x-proxy-region" = "local" } } },
  { name = "filtering", enabled = false, config = {} },
  { name = "event-id", enabled = true, config = {} }
]
per_topic = {}

[event_id]
default_mode = "generate-uuidv7"
hmac_enabled = false
per_topic = {}

[breaker]
local = { error_rate_threshold = 0.1, latency_p99_threshold_ms = 500, window_seconds = 10, half_open_requests = 3 }
arc = { enabled = true, endpoints = ["http://fake-arc:8080/health", "http://fake-arc:8081/health", "http://fake-arc:8082/health", "http://fake-arc:8083/health", "http://fake-arc:8084/health"], poll_interval_seconds = 5, fail_static = true, cache_ttl_seconds = 30 }
composition = "any_open"

[channel]
default_type = "kafka"
default_ack_policy = "primary-sync-secondary-async"
kafka = {
  bootstrap_servers = "kafka-1:9092",
  client_id = "kp-proxy-test",
  producer_config = { "acks" = "all", "linger.ms" = "5", "batch.size" = "16384" },
  topic_mapping = {}
}
channels = [
  { name = "primary", type = "kafka", config = { bootstrap_servers = "kafka-1:9092" } }
]

[wal]
enabled = true
dir = "./wal"
segment_size_mb = 64
fsync_policy = "group_commit"
group_commit_interval_ms = 10
recovery = { verify_checksums = true, truncate_corrupted = true }

[spill]
enabled = true
bucket = "kafka-spill"
region = "us-east-1"
endpoint = "http://minio:9000"
credentials = { access_key_id = "minioadmin", secret_access_key = "minioadmin" }
prefix = "spill/"
upload = { max_concurrent_uploads = 4, multipart_threshold_mb = 64, multipart_chunksize_mb = 16 }
manifest = { format = "json", flush_interval_seconds = 30 }
retention = { max_age_days = 7, max_size_gb = 100 }

[reconciler]
enabled = true
interval_seconds = 60
auto_replay = true
channels = ["primary"]

[crypto]
enabled = false
kms = { provider = "aws", key_id = "alias/kp-proxy-test", region = "us-east-1", endpoint = "http://localstack:4566" }
dek = { algorithm = "Aes256Gcm", rotation_interval_hours = 24, cache_size = 1000 }
headers = { include_key_id = true, include_iv = true, include_tag = true, include_algorithm = true, include_encrypted_dek = true }