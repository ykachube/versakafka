# Scenario-controlled endpoints - auto-generated from current.json
# This file is updated by the scenario watcher script

# Default: all healthy
server {
    listen 8080;
    server_name arc-us-east-1;
    
    location /health {
        return 200 '{"region":"us-east-1","status":"healthy","timestamp":$msec}';
        add_header Content-Type application/json;
    }
    
    location /routing-control {
        return 200 '{"region":"us-east-1","state":"enabled","cluster":"primary"}';
        add_header Content-Type application/json;
    }
}

