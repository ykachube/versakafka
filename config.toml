[proxy]
listen_addr = "0.0.0.0:9092"
max_connections = 10000
connection_timeout = "30s"
request_timeout = "10s"

[proxy.backpressure]
max_pending_requests = 1000
max_request_size = 10485760
enable = true

[telemetry]
service_name = "kp-proxy"
prometheus_port = 9090
log_level = "info"
log_format = "json"

[metadata]
routing_mode = "sni"
rewrite_enabled = true
broker_map = {}

[filters]
chain = []
per_topic = {}

[wasm]
enabled = false
plugin_dir = "./plugins"
abi_version = 1
hot_reload = true

[wasm.limits]
max_memory_mb = 16
max_cpu_time_ms = 10
max_instructions = 1000000
timeout = "50ms"

[event_id]
default_mode = "preserve"
per_topic = {}
hmac_enabled = false
hmac_key = ""

[event_id.headers]
event_id = true
ingest_ts = true
proxy_region = true
proxy_id = true
channel = true

[breaker]
composition = "any-open"

[breaker.local]
error_rate_threshold = 0.5
latency_threshold = "5s"
timeout_threshold = "30s"
window_size = "60s"
min_requests = 10
half_open_requests = 3
half_open_interval = "10s"

[breaker.arc]
enabled = false
endpoints = []
poll_interval = "10s"
cache_ttl = "60s"
fail_static = true

[breaker.per_broker] = {}
[breaker.per_channel] = {}

[[channels]]
name = "primary"
channel_type = "kafka"
ack_policy = "primary-sync-secondary-async"
queue_size = 1000
timeout = "10s"

[wal]
dir = "./wal"
segment_size = 67108864
segment_max_age = "1h"
fsync_policy = "group-commit"
group_commit_interval = "10ms"
max_segments = 1000

[wal.recovery]
truncate_corrupted = true
verify_checksums = true

[spill]
enabled = false
bucket = "kafka-spill"
prefix = "spill/"
upload.multipart_threshold = 8388608
upload.multipart_chunksize = 8388608
upload.max_concurrent_uploads = 10
upload.timeout = "60s"
manifest.enabled = true
manifest.format = "json"
retention.max_age = "168h"

[reconciler]
enabled = false
interval = "300s"
window = "3600s"
checksum = true
auto_replay = true
max_replay_batch = 1000

[crypto]
enabled = false

[crypto.kms]
key_id = ""
region = "us-east-1"
cache_ttl = "300s"

[crypto.dek]
algorithm = "aes256-gcm"
rotation_interval = "24h"
cache_size = 100

[crypto.headers]
key_id = true
iv = true
tag = true
algorithm = true