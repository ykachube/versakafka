global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'kp-dev'
    environment: 'development'

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'kp-proxy'
    static_configs:
      - targets: ['host.docker.internal:9090']
    metrics_path: /metrics

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-1:9092', 'kafka-2:9092', 'kafka-3:9092']

  - job_name: 'minio'
    static_configs:
      - targets: ['minio:9000']
    metrics_path: /minio/v2/metrics/cluster

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']