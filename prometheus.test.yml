global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    environment: 'test'
    cluster: 'kp-test'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'kafka'
    static_configs:
      - targets: ['kafka-1:9092', 'kafka-2:9092', 'kafka-3:9092']
        labels:
          cluster: 'primary'
      - targets: ['kafka-sec-1:9092', 'kafka-sec-2:9092', 'kafka-sec-3:9092']
        labels:
          cluster: 'secondary'

  - job_name: 'proxy'
    static_configs:
      - targets: ['proxy:9095']

  - job_name: 'minio'
    static_configs:
      - targets: ['minio:9000']

  - job_name: 'localstack'
    static_configs:
      - targets: ['localstack:4566']

  - job_name: 'toxiproxy'
    static_configs:
      - targets: ['toxiproxy:8474']

  - job_name: 'fake-arc'
    static_configs:
      - targets: ['fake-arc:8080', 'fake-arc:8081', 'fake-arc:8082', 'fake-arc:8083', 'fake-arc:8084']

  - job_name: 'jaeger'
    static_configs:
      - targets: ['jaeger:14269']

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['host.docker.internal:9100']